name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The image Cloud Run serves, built as Cloud Build builds it (its Dockerfile tests and bundles
      # again), then served on a port of its choosing, as Cloud Run may.
      - name: Build the image
        run: docker build -t golden-path .
      - name: Serve the image
        run: |
          docker run -d --name golden-path -e PORT=9090 -p 9090:9090 golden-path
          for i in $(seq 1 30); do curl -sf http://localhost:9090/healthz && exit 0; sleep 1; done
          docker logs golden-path
          exit 1
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      # Against the image rather than `vite preview`, so its Content-Security-Policy and headers apply.
      - name: Browser tests against the image
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:9090
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
